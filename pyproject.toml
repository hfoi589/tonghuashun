[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ths-level2-web"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "argon2-cffi>=23.1.0",
  "fastapi>=0.115.0",
  "frida==16.7.19",
  "pydantic>=2.7.0",
  "Pillow>=10.0.0",
  "numpy>=1.26.0",
  "opencv-python-headless>=4.10.0.84",
  "redis>=5.0.0",
  "uiautomator2>=3.2.0",
  "uvicorn[standard]>=0.30.0",
  "cryptography>=43.0.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.27.0", "pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
required-version = ">=0.8.14"

[tool.setuptools.packages.find]
include = ["level2_service*"]
