name: ths-level2

services:
  api:
    build:
      context: ..
      target: api
    image: ths-level2-api:local
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      REDIS_URL: redis://redis:6379/0
      CAPTURE_ROOT: /data/captures
      ADB_PATH: adb
      ADB_SERIAL: ${ADB_SERIAL:-redroid:5555}
      ADB_SERVER_SOCKET: ${ADB_SERVER_SOCKET:-}
      ADB_CONNECT: ${ADB_CONNECT:-1}
      TEMPLATE_ROOT: /data/templates
      ADMIN_PASSWORD_FILE: /data/admin/password.hash
      DAILY_CHECK_STATE_FILE: /data/admin/daily-check.json
      RUNNER_POLL_INTERVAL_SECONDS: ${RUNNER_POLL_INTERVAL_SECONDS:-1}
      FRONTEND_ROOT: /app/frontend
      ADMIN_COOKIE_SECURE: ${ADMIN_COOKIE_SECURE:-0}
      FRIDA_SERVER_ENDPOINT: ${FRIDA_SERVER_ENDPOINT:-redroid:27042}
    depends_on:
      redis:
        condition: service_started
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - capture-data:/data/captures
      - template-data:/data/templates
      - admin-data:/data/admin
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  android:
    image: redroid/redroid:13.0.0_64only-latest
    platform: linux/amd64
    profiles: ["linux-redroid"]
    privileged: true
    restart: unless-stopped
    security_opt:
      - apparmor=unconfined
    devices:
      - /dev/binder:/dev/binder
      - /dev/hwbinder:/dev/hwbinder
      - /dev/vndbinder:/dev/vndbinder
    expose:
      - "5555"
    command:
      - androidboot.use_memfd=1
      - androidboot.redroid_gpu_mode=guest
      - androidboot.redroid_width=1080
      - androidboot.redroid_height=1920
      - androidboot.redroid_dpi=480
      - androidboot.redroid_fps=60
    volumes:
      - redroid-data:/data
      - type: bind
        source: /dev/binderfs
        target: /dev/binderfs
        bind:
          create_host_path: false
    networks:
      default:
        aliases:
          - redroid
    healthcheck:
      test: ["CMD-SHELL", "getprop sys.boot_completed | grep -q '^1$'"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  capture-data:
  redis-data:
  redroid-data:
  template-data:
  admin-data:
